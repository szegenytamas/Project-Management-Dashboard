# Local development stack: `docker compose up --build`
#   API:     http://localhost:8000/docs
#   Postgres: localhost:5433 (the API starts using it in Phase 2)
#
# Values like ${POSTGRES_PASSWORD:-dashboard} read from your shell or `.env`,
# falling back to the default after `:-`. Defaults are for local use only.

services:
  api:
    build: .
    image: project-dashboard:local
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy  # wait until Postgres accepts connections

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
    ports:
      # HOST:CONTAINER. Inside the Docker network Postgres is always db:5432;
      # on your machine it is published on 5433 because 5432 is often taken
      # by a locally installed PostgreSQL. 127.0.0.1 = not reachable from your network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data  # data survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
