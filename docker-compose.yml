# Local development stack: `docker compose up --build`
#   API:      http://localhost:8000/docs
#   Postgres: localhost:5433
#   S3:       localhost:5000 (moto emulator; files are kept in memory only)
#
# Start order:  db (healthy) -> migrate (runs, exits 0) -> api   (and s3 (healthy) -> api)
#
# Values like ${POSTGRES_PASSWORD:-dashboard} read from your shell or `.env`,
# falling back to the default after `:-`. Defaults are for local use only.

# Reusable block (YAML anchor): settings shared by the app containers.
# Inside the Compose network the DB host is the service name "db", port 5432 -
# NOT localhost:5433, which only exists on your machine.
x-app-env: &app-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-dashboard}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
  POSTGRES_DB: ${POSTGRES_DB:-dashboard}
  # ":?" = no default; Compose refuses to start if it is not set in .env.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (see .env.example)}
  # Local S3 emulator; dummy credentials (moto accepts any). In AWS none of
  # these are set: the real endpoint and the instance's IAM role are used.
  S3_ENDPOINT_URL: http://s3:5000
  S3_CREATE_BUCKET: "true"
  AWS_ACCESS_KEY_ID: local-dev
  AWS_SECRET_ACCESS_KEY: local-dev

services:
  # S3-compatible emulator (moto). Same S3 API as AWS, no account needed.
  s3:
    image: motoserver/moto:5.2.4
    ports:
      - "127.0.0.1:${S3_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
    ports:
      # HOST:CONTAINER. Published on 5433 because 5432 is often taken by a
      # locally installed PostgreSQL. 127.0.0.1 = not reachable from your network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data  # data survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job: bring the schema up to date, then exit.
  migrate:
    build: .
    image: project-dashboard:local
    command: ["python", "-m", "project_dashboard.db.migrate"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: project-dashboard:local
    environment:
      <<: *app-env
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        # Never serve requests against an outdated schema.
        condition: service_completed_successfully
      s3:
        condition: service_healthy  # the bucket is created at API startup

volumes:
  db-data:
