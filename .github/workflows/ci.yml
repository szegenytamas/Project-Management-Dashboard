name: CI

# Run on every pull request, and on main after a merge.
# Pull requests: lint + type-check + test + build + smoke test.
# main:          the same, then the tested image is pushed to GHCR
#                and deployed to the EC2 server (continuous deployment).
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to a pull request cancels its run that is still going. On main
# nothing is cancelled: that could stop a deployment half-way. Runs on main
# queue instead, so each merge is tested, published and deployed in order.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Database settings for the tests and the smoke test. The values only exist
# inside this throwaway CI database, so they are not secrets.
env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_USER: dashboard
  POSTGRES_PASSWORD: dashboard
  POSTGRES_DB: dashboard

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A real PostgreSQL next to the job, started before the first step.
    # GitHub waits until its health check passes.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml promises ">=3.12", so we test the lowest and the one we ship.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3  # publishes exact versions only - there is no @v10 tag
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint, type-check and test (tox)
        run: uv run tox

  build:
    name: Build package and Docker image
    runs-on: ubuntu-latest
    needs: checks  # don't spend time building code that fails its checks
    # This job may publish to GitHub Container Registry. The built-in
    # GITHUB_TOKEN gets "packages: write" here only - no other job has it,
    # and no personal token or password is stored anywhere.
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3  # publishes exact versions only - there is no @v10 tag
        with:
          version: "0.13.7"

      - name: Build wheel and sdist
        run: uv build

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # The size-limit Lambda's deployment zip (handler + pg8000 + RDS CA bundle),
      # downloadable from the run page and used for deployment in Phase 7.
      - name: Build Lambda package
        run: uv run --no-project python functions/size_limit/package.py

      - name: Upload Lambda package
        uses: actions/upload-artifact@v7
        with:
          name: lambda-size-limit
          path: functions/size_limit/build/size_limit.zip

      # Image name and tags for the registry. Registry names must be lower
      # case (our repository name is not), which metadata-action takes care of.
      #   sha-<commit>  every main build, immutable - deploy exactly this commit
      #   latest        the newest main build
      # The OCI labels it adds (source, revision) link the package to this repo.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false   # pushed below, but only after the smoke test passed
          load: true    # keep the image locally for the smoke test
          tags: project-dashboard:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # End-to-end check of the image, exactly as it will run on the server:
      # migrate the database, start the API, ask whether it is ready.
      # --network host: the container reaches the Postgres service on localhost.
      - name: Smoke test the image
        run: |
          # A fresh random signing key for this run only - never a fixed value.
          # Assigned first, exported second: "export X=$(cmd)" would hide a
          # failing cmd (the step would go on with an empty key).
          JWT_SECRET_KEY=$(openssl rand -hex 32)
          export JWT_SECRET_KEY
          # S3 emulator (moto) on localhost:5000, with dummy credentials.
          docker run -d --name s3 -p 5000:5000 motoserver/moto:5.2.4
          export S3_ENDPOINT_URL=http://localhost:5000 S3_CREATE_BUCKET=true
          export AWS_ACCESS_KEY_ID=ci AWS_SECRET_ACCESS_KEY=ci
          for _ in $(seq 1 20); do curl -fs http://localhost:5000/moto-api/ >/dev/null 2>&1 && break; sleep 1; done

          # The variables passed into the containers, as an array: each element
          # stays one argument, no reliance on word splitting.
          app_env=(-e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB
                   -e JWT_SECRET_KEY -e S3_ENDPOINT_URL -e S3_CREATE_BUCKET -e AWS_ACCESS_KEY_ID
                   -e AWS_SECRET_ACCESS_KEY)
          docker run --rm --network host "${app_env[@]}" project-dashboard:ci \
            python -m project_dashboard.db.migrate
          docker run -d --name api --network host "${app_env[@]}" project-dashboard:ci

          # Poll quietly until uvicorn answers (it needs a moment to start).
          ready=""
          for _ in $(seq 1 20); do
            if curl -fs http://localhost:8000/health/ready >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then echo "API did not become ready"; docker logs api; exit 1; fi
          curl -sS http://localhost:8000/health/ready; echo

          # --fail-with-body: on a 4xx/5xx, still print the response (e.g. the
          # 422 reason) before failing the step.
          api() { curl -sS --fail-with-body "$@"; }

          # Register -> log in -> create a project with the token -> list it.
          # The password must satisfy the policy, including "must not contain
          # the login" - so it deliberately does not contain "smoke".
          login='smoke'
          pw='Ci-Check-Pass-42!'
          api -X POST http://localhost:8000/auth -H 'Content-Type: application/json' \
            -d "{\"login\":\"$login\",\"password\":\"$pw\",\"repeat_password\":\"$pw\"}"; echo
          token=$(api -X POST http://localhost:8000/login -H 'Content-Type: application/json' \
            -d "{\"login\":\"$login\",\"password\":\"$pw\"}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          echo "register + login OK"
          project_id=$(api -X POST http://localhost:8000/projects -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke project","description":"from CI"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          api http://localhost:8000/projects -H "Authorization: Bearer $token" | grep -q '"Smoke project"'
          echo "create + list project OK"

          # Upload a PDF to S3 through the API, download it, compare byte for byte.
          printf '%%PDF-1.7\nsmoke test document\n%%%%EOF\n' > smoke.pdf
          doc_id=$(api -X POST "http://localhost:8000/project/$project_id/documents" \
            -H "Authorization: Bearer $token" -F "files=@smoke.pdf;type=application/pdf" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')
          api "http://localhost:8000/document/$doc_id" -H "Authorization: Bearer $token" -o downloaded.pdf
          cmp smoke.pdf downloaded.pdf
          echo "upload + download document OK"

      # ----------------------------------------------------- publish (main only) --
      # Pull requests stop here. On main, the image that just passed the smoke
      # test is published as it is - not rebuilt - so what is deployed is
      # exactly what was tested.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # short-lived token GitHub creates for this run

      - name: Push the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag project-dashboard:ci "$tag"
            docker push "$tag"
          done
          echo "Published:"; echo "$TAGS"

  # ------------------------------------------------------- deploy (main only) --
  # Continuous deployment: the image just pushed goes live on the EC2 server.
  #
  # No AWS keys are stored in GitHub. The job asks GitHub for a short-lived
  # OIDC token that says "repository X, environment production"; AWS trusts
  # exactly that and returns temporary credentials for the deploy role. The role
  # may only run ONE SSM document (deploy.sh with a validated image tag) on ONE
  # instance - no SSH, no open port, no arbitrary commands.
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The GitHub environment "production" holds the AWS settings (variables
    # below) and only accepts deployments from main. It is also part of the
    # identity AWS checks, and GitHub lists every deployment on the repo page.
    environment:
      name: production
      url: ${{ vars.API_URL }}/docs
    permissions:
      contents: read
      id-token: write  # allows requesting the OIDC token - nothing else
    # Deployments never overlap and are never cancelled half-way; a newer
    # merge waits for the running deployment to finish.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: eu-north-1
      DEPLOY_DOCUMENT: ProjectDashboard-Deploy
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # The exact image this run tested and pushed: sha-<first 7 characters>.
      - name: Run deploy.sh on the server (SSM Run Command)
        run: |
          tag="sha-${GITHUB_SHA::7}"
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DEPLOY_DOCUMENT" \
            --parameters "imageTag=$tag" \
            --comment "CI run $GITHUB_RUN_ID deploys $tag" \
            --query Command.CommandId --output text)
          echo "SSM command $command_id deploys $tag"

          # Wait for the result (at most 10 minutes). Right after send-command
          # the invocation may not exist yet - treat that as "pending".
          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done

          # Show what deploy.sh printed on the server, then pass or fail.
          for stream in StandardOutputContent StandardErrorContent; do
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query "$stream" --output text || true
          done
          if [ "$status" != Success ]; then
            echo "::error::Deployment of $tag ended with status: $status"
            exit 1
          fi
          echo "Deployed $tag"

      # deploy.sh already waited for readiness on the server itself; this checks
      # the same thing from outside, through the security group and the internet.
      - name: Check the API from the internet
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 5 "$API_URL/health/ready"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::$API_URL/health/ready did not answer"
          exit 1
