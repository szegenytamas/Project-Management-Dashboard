name: CI

# Run on every pull request, and on main after a merge.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Database settings for the tests and the smoke test. The values only exist
# inside this throwaway CI database, so they are not secrets.
env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_USER: dashboard
  POSTGRES_PASSWORD: dashboard
  POSTGRES_DB: dashboard

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A real PostgreSQL next to the job, started before the first step.
    # GitHub waits until its health check passes.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml promises ">=3.12", so we test the lowest and the one we ship.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint, type-check and test (tox)
        run: uv run tox

  build:
    name: Build package and Docker image
    runs-on: ubuntu-latest
    needs: checks  # don't spend time building code that fails its checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"

      - name: Build wheel and sdist
        run: uv build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false   # Phase 6 pushes to ECR
          load: true    # keep the image locally for the smoke test
          tags: project-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # End-to-end check of the image, exactly as it will run on the server:
      # migrate the database, start the API, ask whether it is ready.
      # --network host: the container reaches the Postgres service on localhost.
      - name: Smoke test the image
        run: |
          # A fresh random signing key for this run only - never a fixed value.
          export JWT_SECRET_KEY="$(openssl rand -hex 32)"
          APP_ENV="-e POSTGRES_HOST -e POSTGRES_PORT -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB -e JWT_SECRET_KEY"
          docker run --rm --network host $APP_ENV project-dashboard:ci \
            python -m project_dashboard.db.migrate
          docker run -d --name api --network host $APP_ENV project-dashboard:ci

          ready=""
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health/ready; then echo; ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then echo "API did not become ready"; docker logs api; exit 1; fi

          # Register -> log in -> create a project with the token -> list it
          pw='Smoke-Test-Pw-42!'
          curl -fsS -X POST http://localhost:8000/auth -H 'Content-Type: application/json' \
            -d "{\"login\":\"smoke\",\"password\":\"$pw\",\"repeat_password\":\"$pw\"}"; echo
          token=$(curl -fsS -X POST http://localhost:8000/login -H 'Content-Type: application/json' \
            -d "{\"login\":\"smoke\",\"password\":\"$pw\"}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          echo "register + login OK"
          curl -fsS -X POST http://localhost:8000/projects -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke project","description":"from CI"}'; echo
          curl -fsS http://localhost:8000/projects -H "Authorization: Bearer $token" | grep -q '"Smoke project"'
          echo "create + list project OK"
