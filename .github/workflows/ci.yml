name: CI

# Run on every pull request, and on main after a merge.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml promises ">=3.12", so we test the lowest and the one we ship.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint, type-check and test (tox)
        run: uv run tox

  build:
    name: Build package and Docker image
    runs-on: ubuntu-latest
    needs: checks  # don't spend time building code that fails its checks
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"

      - name: Build wheel and sdist
        run: uv build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false   # Phase 6 pushes to ECR
          load: true    # keep the image locally for the smoke test
          tags: project-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 project-dashboard:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "API did not become healthy"; docker logs api; exit 1
