# Alembic configuration for the developer CLI (`uv run alembic ...`).
# The database URL is NOT here: env.py reads it from Settings (.env / environment).

[alembic]
script_location = %(here)s/src/project_dashboard/db/migrations
# File names like 2026_11_04_1a2b3c4d_create_initial_tables.py sort by date.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[post_write_hooks]
# Every new migration file is auto-formatted and lint-fixed with ruff.
hooks = ruff_format, ruff_fix
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
